# ==============================================================================
# SonarQube Project Configuration
# ==============================================================================

# Unique project identification keys
sonar.projectKey=clouddeploy-app
sonar.projectName=CloudDeploy Application
sonar.projectVersion=1.0.0

# Source and Test directories
sonar.sources=app/src/main/java
sonar.tests=app/src/test/java
sonar.java.binaries=app/target/classes
sonar.java.test.binaries=app/target/test-classes

# Encoding
sonar.sourceEncoding=UTF-8

# Code Coverage Integration with JaCoCo
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=app/target/site/jacoco/jacoco.xml

# Quality Gate and Security Exclusions
sonar.exclusions=**/test/**,**/target/**
sonar.coverage.exclusions=**/CloudDeployApplication.java

# Security Hotspots and SAST rules
sonar.security.hotspots.reviewed=false
