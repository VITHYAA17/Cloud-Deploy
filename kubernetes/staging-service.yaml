apiVersion: v1
kind: Service
metadata:
  name: clouddeploy-app-staging-service
  namespace: staging
  labels:
    app: clouddeploy-app
    env: staging
spec:
  type: LoadBalancer
  selector:
    app: clouddeploy-app
    env: staging
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
